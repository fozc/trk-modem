---
:project:
  :which_ceedling: gem
  :ceedling_version: 1.0.1
  :use_mocks: TRUE
  :use_test_preprocessor: :none
  :use_deep_preprocessor: :none
  :use_backtrace: :simple
  :use_decorators: :auto
  :build_root: build/ceedling
  :test_file_prefix: test_
  :default_tasks:
    - test:all
  :test_threads: 1
  :compile_threads: 1
  :release_build: FALSE

:test_build:
  :use_assembly: FALSE

:plugins:
  :load_paths: []
  :enabled:
    - report_tests_pretty_stdout
    - report_tests_log_factory
    - gcov

:report_tests_log_factory:
  :reports:
    - junit

:extension:
  :executable: .out

:paths:
  :test:
    - +:application/**
    - +:efw/**
    - +:gsm/**
    - +:iec104/**
    - +:libs/**
    - +:power_board/**
    - +:rf/**
    - +:scp/**
    - +:web_server/**
  :source:
    - ../Application/**
    - support_sources/**
  :include:
    - ../Application/**
    - ../contiki-kernel/**
  :support:
    - support
  :libraries: []

:files:
  :test: []
  :source: []

:defines:
  :test:
    - UNIT_TEST
    - XSCANF_ENABLE_TESTS
    - NO_CONSOLE_LOG
    - NO_SHELL_LOG
  :release: []
  :use_test_definition: FALSE

:flags:
  :test:
    :compile:
      '*':
        - -std=c11
        - -pedantic
        - -Wall
        - -Wextra
        - -Werror
        - -Wshadow
        - -Wconversion
        - -Wdouble-promotion
        - -Wformat=2
      test_xsnprintf_format_scenario:
        - -Wno-conversion
        - -Wno-sign-conversion
        - -Wno-float-conversion
      test_xscanf_format_scenario:
        - -Wno-sign-conversion
      # Legacy protocol source has implicit narrow/bit-field assignments.
      test_iec104_protocol_scenario:
        - -Wno-conversion
        - -Wno-sign-conversion
      test_rf_json_golden_scenario:
        - -Wno-conversion
        - -Wno-sign-conversion
        - -Wno-float-conversion

:cmock:
  :plugins:
    - :ignore
    - :callback
  :verbosity: 2
  :when_no_prototypes: :error
  :mock_prefix: mock_
  :mock_suffix: ''
  :strippables:
    - '(?:__attribute__\s*\([ (]*.*?[ )]*\)+)'
  :attributes:
    - __ramfunc
    - __irq
    - __fiq
    - register
    - extern
  :treat_externs: :exclude
  :treat_inlines: :exclude
  :memcmp_if_unknown: true
  :when_ptr: :compare_data
  :enforce_strict_ordering: true
  :fail_on_unexpected_calls: true
  :callback_include_count: true

:unity:
  :defines: []

:gcov:
  :summaries: TRUE
  :report_task: FALSE
  :utilities:
    - gcovr
  :reports:
    - HtmlDetailed
    - Cobertura
  :gcovr:
    :report_root: ".."

:tools:
  :gcov_gcovr_report:
    :executable: python
    :arguments:
      - -m
      - gcovr
      - ${1}

:environment: []

:libraries:
  :placement: :end
  :flag: "-l${1}"
  :path_flag: "-L ${1}"
  :system: []
  :test: []
  :release: []

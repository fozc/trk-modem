.btn{border:0;border-radius:6px;padding:8px 14px;font-size:11px;font-weight:700;cursor:pointer;transition:.15s}.btn:disabled{opacity:.45;cursor:not-allowed}.btn-read{background:var(--blue);color:#fff}.btn-read:hover:not(:disabled){background:#12578d}.btn-save{background:var(--green);color:#fff}.btn-save:hover:not(:disabled){background:#157347}.btn-danger{background:var(--red);color:#fff}.btn-muted{background:#e9edf1;color:#394957}.btn-muted:hover:not(:disabled){background:#dce2e7}.btn-small{padding:6px 10px;font-size:10px}.read-state{font-size:10px;color:var(--muted)}.read-state.loaded{color:var(--green)}.read-state.dirty{color:#a86e00}.read-state:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#aeb7c0;margin-right:5px}.read-state.loaded:before{background:var(--green)}.read-state.dirty:before{background:#e0a100}

<body>
<div id="initialLoading" class="loading"><div class="spinner"></div></div>
<div id="loginModal" class="modal" style="display:none">
  <div class="modal-card">
    <h3 id="lblLoginTitle">Cihaz Girişi</h3>
    <div class="field"><label id="lblUsername">Kullanıcı Adı</label><input id="loginUser" type="text" maxlength="16" autocomplete="username"></div>
    <div class="field" style="margin-top:10px"><label id="lblPassword">Şifre</label><input id="loginPass" type="password" maxlength="16" autocomplete="current-password"></div>
    <div id="loginErr" class="err"></div>
    <div class="modal-actions"><button class="btn btn-read" onclick="doLogin()" id="lblLoginBtn">Giriş</button></div>
  </div>
</div>
<div class="app">
  <aside class="sidebar">
    <div class="brand" id="lblBrand">Cihaz Yapılandırma</div>
    <nav class="menu" id="menu"></nav>
    <div class="logout"><button class="btn btn-danger" style="width:100%" onclick="doLogout()" id="lblLogout">Çıkış</button></div>
  </aside>
  <main class="main">
    <header class="header"><h1 id="title">Cihaz</h1><div class="hdr-right"><div class="hint"><span id="lblHint">Veriler yalnızca istendiğinde okunur</span> · <span id="lblWebUi">Web Arayüzü</span> <span id="webUiVer">{{WEB_VERSION}}</span></div><div class="lang-switch"><button id="langTr" onclick="setLang('tr')">TR</button><button id="langEn" onclick="setLang('en')">EN</button></div></div></header>
    <section class="content" id="body"></section>
  </main>
</div>

const t=k=>{const d=I18N[LNG];return (d&&d[k]!==undefined)?d[k]:((I18N.en[k]!==undefined)?I18N.en[k]:k)};
const tf=(k,map)=>t(k).replace(/\{(\w+)\}/g,(_,x)=>(map&&map[x]!==undefined)?map[x]:('{'+x+'}'));
const feederLbl=n=>tf('feedTpl',{n:n+1});
const fmtEpoch=v=>v?new Date(v*1000).toLocaleString(LNG==='tr'?'tr-TR':'en-GB',{timeZone:'UTC'}):t('tNoData');
const fmtLifetime=v=>{if(v===undefined||v===null||v==='')return '-';const s=parseInt(v,10)||0;const p=n=>String(n).padStart(2,'0');return String(Math.floor(s/86400)).padStart(4,'0')+':'+p(Math.floor(s/3600)%24)+':'+p(Math.floor(s/60)%60)+':'+p(s%60)};
const fmt=(v,u,dec)=>{if(v===undefined||v===null||v==='')return '-';let s=dec!==undefined?parseFloat(v).toFixed(dec):String(v);return u?s+' '+u:s};
const toast=(m,t2='info')=>{const e=document.createElement('div');e.className='toast '+t2;e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),CFG_TOAST_DURATION_MS)};
const showLoad=()=>{if(loading)return;loading=true;const e=document.createElement('div');e.id='requestLoading';e.className='loading';e.innerHTML='<div class="spinner"></div>';document.body.appendChild(e);document.querySelectorAll('button').forEach(b=>b.disabled=true)};
const hideLoad=()=>{loading=false;$('requestLoading')?.remove();document.querySelectorAll('button').forEach(b=>b.disabled=false)};
const confirmAction=(msg,fn)=>{const o=document.createElement('div');o.className='modal';o.innerHTML='<div class="modal-card"><h3>'+esc(t('confirmT'))+'</h3><p style="color:#64748b;line-height:1.5;margin-bottom:12px">'+esc(msg)+'</p><div class="modal-actions"><button class="btn btn-muted" id="cancelConfirm">'+esc(t('cancel'))+'</button><button class="btn btn-danger" id="okConfirm">'+esc(t('confirmBtn'))+'</button></div></div>';document.body.appendChild(o);$('cancelConfirm').onclick=()=>o.remove();$('okConfirm').onclick=()=>{o.remove();fn()}};

/* Dil degistirme: statik etiketler + menu + aktif sayfa yeniden cizilir.
 * Terminal ve sistem gunlugu icerigi DOM'da tutuldugu icin dile geciste
 * korunur (pageCache'te degiller). */
function setLang(l){
  if(l!=='tr'&&l!=='en')l='tr';
  LNG=l;
  try{localStorage.setItem('tsb23lang',l)}catch(e){}
  document.documentElement.lang=l;
  document.title=t('docTitle');
  $('langTr').classList.toggle('active',l==='tr');
  $('langEn').classList.toggle('active',l==='en');
  $('lblLoginTitle').textContent=t('loginTitle');$('lblUsername').textContent=t('username');$('lblPassword').textContent=t('password');
  $('lblLoginBtn').textContent=t('loginBtn');$('lblBrand').textContent=t('brand');$('lblLogout').textContent=t('logout');
  $('lblHint').textContent=t('hint');$('lblWebUi').textContent=t('webUi');
  buildMenu();
  if(curId){
    let keepTerm=null;
    if(curId==='terminal')keepTerm=$('trmOut')?$('trmOut').innerHTML:null;
    renderPage(curId,pageCache[curId]);
    if(curId==='terminal'&&keepTerm!==null&&$('trmOut')){$('trmOut').innerHTML=keepTerm;$('trmCmd')?.focus()}
  }
}

// ---------------- HTTP / SESSION ----------------
const api=async(url,opt={})=>{
  const skipAuthCheck=!!opt.skipAuthCheck; delete opt.skipAuthCheck;
  if(s_sessionToken)url+=(url.includes('?')?'&':'?')+'t='+encodeURIComponent(s_sessionToken);
  const ctrl=new AbortController(),tid=setTimeout(()=>ctrl.abort(),CFG_HTTP_REQUEST_TIMEOUT_MS);
  try{
    const r=await fetch(url,{...opt,signal:ctrl.signal});clearTimeout(tid);
    if(r.status===401&&!skipAuthCheck){s_sessionToken=null;s_role=null;buildMenu();showLoginModal();toast(t('tAuthReq'),'info');throw new Error(t('tAuthReq'))}
    if(!r.ok)throw new Error('HTTP '+r.status);
    return await r.json();
  }catch(e){clearTimeout(tid);if(!skipAuthCheck&&e.name!=='Error'&&!!s_sessionToken)toast(t('tConnErr'),'err');throw e}
};
const showLoginModal=()=>{const m=$('loginModal');m.style.display='flex';$('loginPass').value='';setTimeout(()=>$('loginUser')?.focus(),80);if(sessionTimeout){clearTimeout(sessionTimeout);sessionTimeout=null}};
const hideLoginModal=()=>{$('loginModal').style.display='none'};
const startSessionTimeout=()=>{if(sessionTimeout)clearTimeout(sessionTimeout);sessionTimeout=setTimeout(()=>{toast(t('tSessExp'),'info');doLogout()},CFG_SESSION_TIMEOUT_MS)};
const resetSessionTimeout=()=>{if(s_sessionToken)startSessionTimeout()};
const doLogin=async()=>{const username=$('loginUser').value.substring(0,16),password=$('loginPass').value.substring(0,16);$('loginErr').textContent='';if(!username||!password){$('loginErr').textContent=t('tEnterCred');return}$('loginPass').value='';try{showLoad();const r=await api('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password}),skipAuthCheck:true});hideLoad();if(r.success===true){s_sessionToken=r.token||null;s_role=r.role||null;if(s_sessionToken)sessionStorage.setItem('sessionToken',s_sessionToken);sessionStorage.setItem('sessionRole',s_role);buildMenu();hideLoginModal();toast(t('tLoginOk'),'ok');startSessionTimeout()}else{$('loginErr').textContent=r.error||t('tInvalidCred');$('loginPass').focus()}}catch(e){hideLoad();$('loginErr').textContent=t('tLoginFail');$('loginPass').focus()}};
const doLogout=async()=>{try{await api('/auth/logout',{method:'POST',skipAuthCheck:true})}catch(e){}s_sessionToken=null;s_role=null;sessionStorage.removeItem('sessionToken');sessionStorage.removeItem('sessionRole');buildMenu();if(sessionTimeout)clearTimeout(sessionTimeout);showLoginModal();toast(t('tLogoutOk'),'info')};

// ---------------- DIRTY STATE ----------------
const setDirty=(page,el,dirty)=>{if(!dirtyPages[page])dirtyPages[page]=new Set();if(dirty)dirtyPages[page].add(el);else dirtyPages[page].delete(el);el.classList.toggle('dirty',dirty);const dot=el.closest('.field')?.querySelector('.dirty-dot');if(dot)dot.style.display=dirty?'inline-block':'none';updatePageState(page)};
const clearDirty=page=>{(dirtyPages[page]||new Set()).forEach(el=>el.classList.remove('dirty'));dirtyPages[page]=new Set();document.querySelectorAll('#body .dirty-dot').forEach(e=>e.style.display='none');updatePageState(page)};
const hasDirty=page=>(dirtyPages[page]?.size||0)>0;
const updatePageState=page=>{const e=$('state-'+page);if(!e)return;e.className='read-state '+(hasDirty(page)?'dirty':pageCache[page]?'loaded':'');e.textContent=hasDirty(page)?t('stDirty'):pageCache[page]?t('stLoaded'):t('stNotRead')};
const bindDirty=(page,root=document)=>{root.querySelectorAll('[data-dirty]').forEach(el=>{const original=el.dataset.original;const current=el.type==='checkbox'?String(el.checked):el.value;el.addEventListener('input',()=>setDirty(page,el,(el.type==='checkbox'?String(el.checked):el.value)!==el.dataset.original));el.addEventListener('change',()=>setDirty(page,el,(el.type==='checkbox'?String(el.checked):el.value)!==el.dataset.original));if(current!==original)setDirty(page,el,true)})};
const markOriginals=root=>root.querySelectorAll('[data-dirty]').forEach(el=>{el.dataset.original=el.type==='checkbox'?String(el.checked):el.value;el.classList.remove('dirty')});

const numField=(id,label,v,min,max,ro=false,unit='',stp='')=>{const rng=(!ro&&min!=null&&max!=null)?`<span class="fld-hint">${min}–${max}${unit?' '+esc(unit):''}</span>`:(!ro&&unit?`<span class="fld-hint">${esc(unit)}</span>`:'');return `<div class="field"><label>${esc(label)}${rng}${!ro?'<span class="dirty-dot" style="display:none"></span>':''}</label><input id="${id}" data-dirty="1" type="number" value="${v??''}" min="${min??''}" max="${max??''}"${stp?` step="${stp}"`:''} ${ro?'disabled class="readonly"':''}><div class="err" id="err-${id}"></div></div>`};
const textField=(id,label,v,max,ro=false)=>{const rng=(!ro&&max!=null&&max!=='')?`<span class="fld-hint">max ${max}</span>`:'';return `<div class="field"><label>${esc(label)}${rng}${!ro?'<span class="dirty-dot" style="display:none"></span>':''}</label><input id="${id}" data-dirty="1" type="text" value="${esc(v??'')}" maxlength="${max??''}" ${ro?'disabled class="readonly"':''}><div class="err" id="err-${id}"></div></div>`};
const checkField=(id,label,v)=>`<div class="field"><label>&nbsp;</label><label class="check"><input id="${id}" data-dirty="1" type="checkbox" ${v?'checked':''}><span>${esc(label)}</span><span class="dirty-dot" style="display:none"></span></label></div>`;
const feederField=(prefix,key,i,label,v,min=1,max=65535)=>`<div class="field"><label>${esc(label)}</label><input type="number" data-id="${prefix}" data-key="${key}" data-i="${i}" data-dirty="1" value="${v??0}" min="${min}" max="${max}"><div class="err"></div></div>`;
const feederCheck=(prefix,i,label,checked)=>`<div class="field"><label class="check"><input type="checkbox" data-id="${prefix}" data-key="inUse" data-i="${i}" data-dirty="1" ${checked?'checked':''}><span>${esc(label)}</span></label></div>`;
const selectField=(id,label,value,opts)=>{const all=(opts.map(String).includes(String(value))?opts:[value,...opts]);return `<div class="field"><label>${esc(label)}</label><select id="${id}" data-dirty="1">${all.map(o=>`<option value="${o}" ${String(o)===String(value)?'selected':''}>${o}</option>`).join('')}</select><div class="err" id="err-${id}"></div></div>`};
const selectFieldL=(id,label,value,opts)=>{if(!opts.map(o=>String(o[0])).includes(String(value)))opts=[[value,String(value)],...opts];return `<div class="field"><label>${esc(label)}</label><select id="${id}" data-dirty="1">${opts.map(o=>`<option value="${o[0]}" ${String(o[0])===String(value)?'selected':''}>${esc(o[1])}</option>`).join('')}</select><div class="err" id="err-${id}"></div></div>`};
/* shared feeder scaffolding: tab bar + pane wrapper (tabs visible up to
 * FEEDER_TABS; panes for all FEEDER_COUNT kept in DOM so POST data of
 * hidden feeders is preserved unchanged) */
const feederTabs=(sel,act=0)=>'<div class="tabbar">'+Array.from({length:FEEDER_TABS},(_,i)=>'<button class="tab '+(i===act?'active':'')+'" onclick="'+sel+'('+i+')">'+esc(feederLbl(i))+'</button>').join('')+'</div>';
const paneOpen=(pfx,i)=>'<div id="'+pfx+'-pane-'+i+'" class="pane '+(i===0?'active':'')+'"'+(i>=FEEDER_TABS?' style="display:none"':'')+'>';
const sectionHead=(title,page,desc='')=>`<div class="card-head"><div><h3>${esc(title)}</h3>${desc?`<div class="sub">${esc(desc)}</div>`:''}</div></div>`;
const pageHead=(title,page,desc='',rw=true)=>`<div class="card" style="margin-bottom:14px"><div class="card-head"><div><h3>${esc(title)}</h3>${desc?`<div class="sub">${esc(desc)}</div>`:''}</div><div class="card-actions"><span id="state-${page}" class="read-state">${esc(t('stNotRead'))}</span><button class="btn btn-read btn-small" onclick="readPage('${page}')">${esc(t('btnRead'))}</button>${rw?`<button class="btn btn-save btn-small" onclick="savePage('${page}')">${esc(t('btnSave'))}</button>`:''}</div></div></div>`;
const emptyCard=(title,page,desc='')=>`<div class="card"><div class="card-head"><div><h3>${esc(title)}</h3>${desc?`<div class="sub">${esc(desc)}</div>`:''}</div><div class="card-actions"><span id="state-${page}" class="read-state">${esc(t('stNotRead'))}</span><button class="btn btn-read btn-small" onclick="readPage('${page}')">${esc(t('btnRead'))}</button></div></div><div class="card-body"><div class="empty">${t('pressRead')}</div></div></div>`;
const getInt=id=>{const v=$(id)?.value;return v===''?0:parseInt(v,10)||0};
const getFloat=id=>{const v=$(id)?.value;return v===''?0:parseFloat(v)||0};
const getText=id=>$(id)?.value||'';
const getBool=id=>!!$(id)?.checked;
const validation=(id,req,min,max)=>{const el=$(id);if(!el)return true;const err=$('err-'+id);if(err)err.textContent='';el.classList.remove('invalid');const v=el.value;if(req&&v===''){if(err)err.textContent=t('required');el.classList.add('invalid');return false}if(el.type==='number'&&v!==''){const n=Number(v);if(!Number.isFinite(n)||(min!==undefined&&n<min)||(max!==undefined&&n>max)){if(err)err.textContent=t('range')+min+' .. '+max;el.classList.add('invalid');return false}}return true};

function extractPage(page){if(page==='iec104'){const d={};[['Port','iec-Port'],['PeriodicSend','iec-PeriodicSend'],['T0','iec-T0'],['T1','iec-T1'],['T2','iec-T2'],['T3','iec-T3'],['K','iec-K'],['W','iec-W'],['OriginatorAddr','iec-OriginatorAddr'],['CommonAddr','iec-CommonAddr'],['SBOTimeout','iec-SBOTimeout'],['AkuUyarisi','iec-AkuUyarisi'],['ModemReset','iec-ModemReset']].forEach(x=>d[x[0]]=getInt(x[1]));d.SBO=getBool('iec-SBO');const h={};const keys=['inUse','IOA_R_ArizaAkimi','IOA_S_ArizaAkimi','IOA_T_ArizaAkimi','IOA_R_ArizaSuresi','IOA_S_ArizaSuresi','IOA_T_ArizaSuresi','IOA_R_ArizaTuru','IOA_S_ArizaTuru','IOA_T_ArizaTuru','IOA_R_AnlikAkim','IOA_S_AnlikAkim','IOA_T_AnlikAkim','IOA_R_EnerjiVarYok','IOA_S_EnerjiVarYok','IOA_T_EnerjiVarYok','IOA_R_NominalAkimVarYok','IOA_S_NominalAkimVarYok','IOA_T_NominalAkimVarYok','IOA_R_RfhabVarYok','IOA_S_RfhabVarYok','IOA_T_RfhabVarYok'];keys.forEach(k=>h[k]=[]);document.querySelectorAll('[data-id="iec"]').forEach(e=>h[e.dataset.key].push(e.type==='checkbox'?e.checked:getIntEl(e)));d.Hatlar=h;return d}
  if(page==='modbus'){const d={CihazID:getInt('mod-CihazID'),BaudRate:getInt('mod-BaudRate')},h={};const keys=['inUse','ADDR_R_ArizaAkimi','ADDR_S_ArizaAkimi','ADDR_T_ArizaAkimi','ADDR_R_ArizaSuresi','ADDR_S_ArizaSuresi','ADDR_T_ArizaSuresi','ADDR_R_ArizaTuru','ADDR_S_ArizaTuru','ADDR_T_ArizaTuru','ADDR_R_AnlikAkim','ADDR_S_AnlikAkim','ADDR_T_AnlikAkim','ADDR_R_EnerjiVarYok','ADDR_S_EnerjiVarYok','ADDR_T_EnerjiVarYok','ADDR_R_NominalAkimVarYok','ADDR_S_NominalAkimVarYok','ADDR_T_NominalAkimVarYok','ADDR_R_RfhabVarYok','ADDR_S_RfhabVarYok','ADDR_T_RfhabVarYok'];keys.forEach(k=>h[k]=[]);document.querySelectorAll('[data-id="mod"]').forEach(e=>h[e.dataset.key].push(e.type==='checkbox'?e.checked:getIntEl(e)));d.Hat=h;return d}
  if(page==='rf'){const d={};const iKeys=['HatID','ZoneID','SetEdilebilirAcmaArizaSayisi','OluHatAkimiDogrulamaSuresi','YenilenmeSifirlamaSuresi'];const fKeys=['SistemNominalAkimi','SetEdilebilirActirmaEsikAkimi','ArtimliAkimEsigi','HatKopukHatBosta'];const sKeys=['R_DEVICEID','S_DEVICEID','T_DEVICEID'];['inUse','CalismaModu','HatFrekansi',...iKeys,...fKeys,...sKeys].forEach(k=>d[k]=[]);
    for(let i=0;i<FEEDER_COUNT;i++){d.inUse[i]=getBool('rf-inUse-'+i);d.CalismaModu[i]=getInt('rf-CalismaModu-'+i);d.HatFrekansi[i]=getInt('rf-HatFrekansi-'+i);iKeys.forEach(k=>d[k][i]=getInt('rf-'+k+'-'+i));fKeys.forEach(k=>d[k][i]=getFloat('rf-'+k+'-'+i));sKeys.forEach(k=>d[k][i]=getText('rf-'+k+'-'+i).trim().toUpperCase())}return d}
  if(page==='device')return extractDevice();return {};
}
const getIntEl=e=>e.value===''?0:parseInt(e.value,10)||0;
function extractDevice(){return {WebArayuzuPortu:getInt('dev-WebArayuzuPortu'),SimKartPin:getInt('dev-SimKartPin'),SimKartAPN:getText('dev-SimKartAPN'),SimKartAPNUsername:getText('dev-SimKartAPNUsername'),SimKartAPNSifresi:getText('dev-SimKartAPNSifresi'),NtpServer:getText('dev-NtpServer'),NtpServerPortu:getInt('dev-NtpServerPortu'),TimeZone:getInt('dev-TimeZone'),PeriyodikModemResetPeriyodu:getInt('dev-PeriyodikModemResetPeriyodu')*3600,WebIlkVeriZamanAsimi:getInt('dev-WebIlkVeriZamanAsimi'),WebBostaKalmaZamanAsimi:getInt('dev-WebBostaKalmaZamanAsimi'),IEC104IlkVeriZamanAsimi:getInt('dev-IEC104IlkVeriZamanAsimi'),IEC104BostaKalmaZamanAsimi:getInt('dev-IEC104BostaKalmaZamanAsimi')}}

// ---------------- NAVIGATION / RENDER ----------------
function renderPage(id,d){let html='';if(id==='iec104')html=pageCache.iec104?renderIec104(pageCache.iec104):emptyCard(t('iecTitle'),'iec104',t('iecSub'));else if(id==='modbus')html=pageCache.modbus?renderModbus(pageCache.modbus):emptyCard(t('modTitle'),'modbus',t('modSub'));else if(id==='rf')html=pageCache.rf?renderRf(pageCache.rf):emptyCard(t('rfTitle'),'rf',t('rfSub'));else if(id==='rfmon')html=renderRfMon(pageCache.rfmon);else if(id==='board')html=pageCache.board?renderBoard(pageCache.board):renderBoard(null);else if(id==='iec-faults')html=renderFaults();else if(id==='syslogs')html=renderLogs();else if(id==='device')html=pageCache.device?renderDevice(pageCache.device):emptyCard(t('devTitle'),'device',t('devSub'));else if(id==='terminal')html=renderTerminal();$('body').innerHTML=html;curId=id;$('title').textContent=t(menuPages.find(p=>p[0]===id)?.[1]||id);document.querySelectorAll('.mi').forEach(e=>e.classList.toggle('a',e.dataset.id===id));dirtyPages[id]=new Set();if(id==='terminal'){$('trmCmd')?.addEventListener('keydown',e=>{if(e.key==='Enter')trmSend()});$('trmCmd')?.focus()}if(id==='rf'&&pageCache.rf){selectRfTab(0);rfBindLive()}markOriginals($('body'));bindDirty(id,$('body'));updatePageState(id)}
function switchPageNow(id){renderPage(id,pageCache[id])}
function switchPage(id){if(loading||id===curId)return;if(curId&&hasDirty(curId)){confirmAction(t('tLeaveDirty'),()=>switchPageNow(id));return}switchPageNow(id)}
function buildMenu(){const m=$('menu');m.innerHTML='';menuPages.forEach(p=>{if(p[0]==='fwupdate'&&s_role!=='admin')return;const e=document.createElement('div');e.className='mi';e.dataset.id=p[0];e.textContent=t(p[1]);e.onclick=()=>{if(p[0]==='fwupdate'){window.open('/fw_update.html?t='+encodeURIComponent(s_sessionToken||''),'_blank');return}switchPage(p[0])};m.appendChild(e)})}
function selectRfTab(i){document.querySelectorAll('#body .tab').forEach((e,n)=>e.classList.toggle('active',n===i));for(let n=0;n<FEEDER_COUNT;n++)$('rf-pane-'+n)?.classList.toggle('active',n===i)}
function selectIecTab(i){document.querySelectorAll('#body .tab').forEach((e,n)=>e.classList.toggle('active',n===i));for(let n=0;n<FEEDER_COUNT;n++)$('iec-pane-'+n)?.classList.toggle('active',n===i)}
function selectModTab(i){document.querySelectorAll('#body .tab').forEach((e,n)=>e.classList.toggle('active',n===i));for(let n=0;n<FEEDER_COUNT;n++)$('mod-pane-'+n)?.classList.toggle('active',n===i)}
function selectFaultFeeder(i){faultFeeder=i;renderPage('iec-faults')}

// ---------------- MONITORING ----------------
async function readRfFeeder(i){if(loading)return;try{showLoad();const r=await api('/monitor/rf/'+i);hideLoad();if(r.success===false)throw new Error(r.error||t('tFailed'));const d=r.data?.lines?.[0]||r.lines?.[0]||r.data||r;if(!pageCache.rfmon)pageCache.rfmon=[];pageCache.rfmon[i]=d;renderPage('rfmon');const card=$('rfmon-'+i);if(card){const body=card.querySelector('.card-body');body.innerHTML=buildRfMonitorTable(d)}toast(tf('tFeedRead',{n:i+1}),'ok')}catch(e){hideLoad();toast(t('tReadErr')+e.message,'err')}}
function buildRfMonitorTable(d){const fields=[['DEVICEID',t('monDev'),''],['CalismaModu',t('monMode'),''],['HatFrekansi',t('monFreq'),'Hz'],['SistemSicakligi',t('monSysTemp'),'°C'],['SistemDCGerilimi',t('monSysDc'),'V'],['5Vdc','5V DC','V'],['3V3dc','3.3V DC','V'],['ActirmaDCGerilimi',t('monTrigDc'),'V'],['FazAkimi',t('monPhCur'),'A'],['FazHataAkimi',t('monPhFault'),'A'],['AktifArizaSayaci',t('monActFault'),''],['GecmisAcmaSayisi',t('monTripCnt'),''],['RSSI','RSSI','dBm'],['LQI','LQI','']];let h='<div class="table-wrap"><table class="phase-table"><thead><tr><th>'+esc(t('thParam'))+'</th><th>L1</th><th>L2</th><th>L3</th></tr></thead><tbody>';fields.forEach(f=>{const a=d[f[0]]||['-','-','-'];h+='<tr><td>'+esc(f[1])+'</td><td>'+esc(fmt(a[0],f[2],f[0]==='5Vdc'||f[0]==='3V3dc'?2:f[0]==='FazAkimi'||f[0]==='FazHataAkimi'?1:undefined))+'</td><td>'+esc(fmt(a[1],f[2],f[0]==='5Vdc'||f[0]==='3V3dc'?2:f[0]==='FazAkimi'||f[0]==='FazHataAkimi'?1:undefined))+'</td><td>'+esc(fmt(a[2],f[2],f[0]==='5Vdc'||f[0]==='3V3dc'?2:f[0]==='FazAkimi'||f[0]==='FazHataAkimi'?1:undefined))+'</td></tr>'});return h+'</tbody></table></div>'}
async function readBoard(){await readPage('board')}

// ---------------- FAULTS / LOGS ----------------
async function loadFaults(){if(loading)return;try{showLoad();const r=await api('/faults?feeder='+faultFeeder);hideLoad();if(r.success===false)throw new Error(r.error||t('tFailed'));rfFaultCache[faultFeeder]=r;renderPage('iec-faults');const total=(r.tc||[0,0,0]).reduce((a,b)=>a+b,0)+(r.pc||[0,0,0]).reduce((a,b)=>a+b,0);toast(tf('tFaultsLoaded',{n:faultFeeder+1,m:total}),'ok')}catch(e){hideLoad();toast(t('tReadErr')+e.message,'err')}}
async function loadSysLogs(){if(loading)return;const restart=sysLogLines.length>0&&sysLogOffset>=sysLogTotal;if(restart){sysLogLines=[];sysLogOffset=0;const c0=$('sysLogContent');if(c0){c0.classList.add('empty');c0.innerHTML=esc(t('logsPress'))}}try{showLoad();const r=await api('/syslogs?offset='+sysLogOffset+'&limit=30');hideLoad();if(r.success===false)throw new Error(r.error||t('tFailed'));const logs=r.recs?r.recs.split('\n').filter(x=>x.trim()):[];sysLogTotal=Number(r.t)||0;sysLogLines=sysLogLines.concat(logs);sysLogOffset+=logs.length;const c=$('sysLogContent');if(c){c.classList.remove('empty');c.innerHTML=sysLogLines.map(x=>'<div class="log">'+esc(x)+'</div>').join('')}const b=$('sysLogBtn');if(b)b.textContent=(sysLogLines.length>0&&sysLogOffset>=sysLogTotal)?t('btnLogRestart'):t('btnNext');toast(tf('tLogsLoaded',{n:logs.length}),'ok')}catch(e){hideLoad();toast(t('tReadErr')+e.message,'err')}}

// ---------------- ACTIONS / TERMINAL ----------------
function rebootDevice(){confirmAction(t('tRebootAsk'),async()=>{try{showLoad();const r=await api('/device/reboot',{method:'POST'});hideLoad();if(r.success===false)throw new Error(r.error||t('tFailed'));toast(r.message||t('tRebootOk'),'ok')}catch(e){hideLoad();toast(t('tErr')+e.message,'err')}})}
const trmTs=()=>{const n=new Date(),p=(v,l=2)=>String(v).padStart(l,'0');return p(n.getHours())+':'+p(n.getMinutes())+':'+p(n.getSeconds())+'.'+p(n.getMilliseconds(),3)};
function trmAppend(text,cls){const out=$('trmOut');if(!out)return;const e=document.createElement('div');e.className='term-line '+cls;e.innerHTML='<span class="term-ts">'+trmTs()+'</span>';const t2=document.createElement('span');t2.textContent=(cls==='cmd'?'> ':'< ')+text;e.appendChild(t2);out.appendChild(e);out.scrollTop=out.scrollHeight}
async function trmSend(){if(terminalBusy)return;const inp=$('trmCmd');if(!inp)return;const cmd=inp.value;if(!cmd)return;inp.value='';trmAppend(cmd,'cmd');terminalBusy=true;inp.disabled=true;try{const post=await api('/serial',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tx:cmd})});if(post.rx)trmAppend(post.rx,'res');else if(post.pending){const deadline=Date.now()+12000;while(Date.now()<deadline){await new Promise(r=>setTimeout(r,1000));const r=await api('/serial',{method:'GET'});if(r.rx){trmAppend(r.rx,'res');break}}}}catch(e){trmAppend(t('tErr')+e.message,'cmd')}terminalBusy=false;inp.disabled=false;inp.focus()}
function trmClr(){if($('trmOut'))$('trmOut').innerHTML=''}

// ---------------- INIT ----------------
document.addEventListener('click',resetSessionTimeout);document.addEventListener('change',e=>{const el=e.target;if(el&&el.tagName==='INPUT'&&el.type==='number'&&!el.disabled&&el.value!==''){const mn=el.min!==''?parseFloat(el.min):-Infinity,mx=el.max!==''?parseFloat(el.max):Infinity,v=parseFloat(el.value);if(Number.isFinite(v)){if(v<mn){el.value=mn;el.dispatchEvent(new Event('input',{bubbles:true}))}else if(v>mx){el.value=mx;el.dispatchEvent(new Event('input',{bubbles:true}))}}}});document.addEventListener('keypress',e=>{resetSessionTimeout();if(e.key==='Enter'&&$('loginModal').style.display==='flex')doLogin()});
function init(){const saved=sessionStorage.getItem('sessionToken');if(saved)s_sessionToken=saved;s_role=sessionStorage.getItem('sessionRole');setLang(LNG);switchPage('iec104');$('initialLoading').remove();showLoginModal()}
init();

<div id="initialLoading" class="loading"><div class="spinner"></div></div>
<div id="loginModal" class="modal" style="display:none">
  <div class="modal-card">
    <h3 id="lblLoginTitle">Cihaz Girişi</h3>
    <div class="field"><label id="lblUsername">Kullanıcı Adı</label><input id="loginUser" type="text" maxlength="16" autocomplete="username"></div>
    <div class="field" style="margin-top:10px"><label id="lblPassword">Şifre</label><input id="loginPass" type="password" maxlength="16" autocomplete="current-password"></div>
    <div id="loginErr" class="err"></div>
    <div class="modal-actions"><button class="btn btn-read" onclick="doLogin()" id="lblLoginBtn">Giriş</button></div>
  </div>
</div>
<div class="app">
  <aside class="sidebar">
    <div class="brand" id="lblBrand">Cihaz Yapılandırma</div>
    <nav class="menu" id="menu"></nav>
    <div class="logout"><button class="btn btn-danger" style="width:100%" onclick="doLogout()" id="lblLogout">Çıkış</button></div>
  </aside>
  <main class="main">
    <header class="header"><h1 id="title">Cihaz</h1><div class="hdr-right"><div class="hint"><span id="lblHint">Veriler yalnızca istendiğinde okunur</span> · <span id="lblWebUi">Web Arayüzü</span> <span id="webUiVer">{{WEB_VERSION}}</span></div><div class="lang-switch"><button id="langTr" onclick="setLang('tr')">TR</button><button id="langEn" onclick="setLang('en')">EN</button></div></div></header>
    <section class="content" id="body"></section>
  </main>
</div>

let LNG=(()=>{try{const l=localStorage.getItem('tsb23lang');return(l==='en'||l==='tr')?l:'tr'}catch(e){return 'tr'}})();
const t=k=>{const d=I18N[LNG];return (d&&d[k]!==undefined)?d[k]:((I18N.en[k]!==undefined)?I18N.en[k]:k)};
const tf=(k,map)=>t(k).replace(/\{(\w+)\}/g,(_,x)=>(map&&map[x]!==undefined)?map[x]:('{'+x+'}'));
const feederLbl=n=>tf('feedTpl',{n:n+1});
const fmtEpoch=v=>v?new Date(v*1000).toLocaleString(LNG==='tr'?'tr-TR':'en-GB',{timeZone:'UTC'})+' UTC':t('timeUnavailable');
const fmtLifetime=v=>{if(v===undefined||v===null||v==='')return t('dataUnavailable');const s=parseInt(v,10)||0;const p=n=>String(n).padStart(2,'0');return String(Math.floor(s/86400)).padStart(4,'0')+':'+p(Math.floor(s/3600)%24)+':'+p(Math.floor(s/60)%60)+':'+p(s%60)};
function formatNetwork(d){const names={2:'2G / GSM',3:'3G / UMTS',4:'4G / LTE'};const tech=names[d.GsmRAT];if(!tech)return t('signalUnknown');const regs=d.GsmRAT===4?[d.GsmCEREG]:[d.GsmCREG,d.GsmCGREG];const known=regs.some(v=>v===0||v===2||v===3);const registered=regs.some(v=>v===1||v===5);return tech+' — '+t(registered?'networkRegistered':known?'networkNotRegistered':'signalUnknown')}

const authError=message=>message==='Invalid credentials'?t('loginInvalid'):message==='Too many attempts, try again later'?t('loginWait'):message;
function userError(error){
  const message=error?.message||String(error);
  if(error?.name==='AbortError'||error?.name==='TypeError')return t('connectionUnknown');
  const code=/^HTTP (\d+)/.exec(message);
  if(code)return t(code[1]==='401'?'httpAuth':code[1]==='409'?'httpBusy':code[1]==='400'?'httpInvalid':'httpServer')+' ('+message+')';
  return message;
}
// ---------------- HTTP / SESSION ----------------
const api=async(url,opt={})=>{
  const skipAuthCheck=!!opt.skipAuthCheck; delete opt.skipAuthCheck;
  if(s_sessionToken)url+=(url.includes('?')?'&':'?')+'t='+encodeURIComponent(s_sessionToken);
  const ctrl=new AbortController(),tid=setTimeout(()=>ctrl.abort(),CFG_HTTP_REQUEST_TIMEOUT_MS);
  try{
    const r=await fetch(url,{...opt,signal:ctrl.signal});clearTimeout(tid);
    if(r.status===401&&!skipAuthCheck){s_sessionToken=null;s_role=null;buildMenu();showLoginModal();toast(t('tAuthReq'),'info');throw new Error(t('tAuthReq'))}
    if(r.status===401&&skipAuthCheck&&url.split('?')[0]==='/auth/login')return await r.json();
    if(!r.ok){const message=(r.status===400||r.status===409)?await r.text():'';throw new Error(message?(t(r.status===409?'httpBusy':'httpInvalid')+' · '+message):'HTTP '+r.status)}
    return await r.json();
  }catch(e){clearTimeout(tid);if(!skipAuthCheck&&e.name!=='Error'&&!!s_sessionToken)toast(t('tConnErr'),'err');throw e}
};

function modbusMapRows(map, block, phase=0, view='live', record=0){
  if(!map)return [];
  if(!block.startsWith('feeder:'))return (map[block]||[]).map(f=>({...{field:f[0],address:f[1],count:f[2],type:f[3],unit:f[4]},command:block==='Control'&&f[0]==='modem_reset'}));
  const base=map.FeederBase+Number(block.split(':')[1])*map.FeederStride;
  const rows=[];
  const add=(field,address,count,type,unit)=>rows.push({field,address,count,type,unit});
  add('feeder_quality',base+map.FeederQualityOffset,1,'UINT16','');
  if(view==='live'){
    (map.Phase||[]).forEach(f=>add(f[0],base+map.PhaseOffset+phase*map.PhaseStride+f[1],f[2],f[3],f[4]));
  }
  add('temp_count',base+map.TempCountOffset+phase,1,'UINT16','');
  add('perm_count',base+map.PermCountOffset+phase,1,'UINT16','');
  if(view!=='live'){
    const offset=view==='temp'?map.TempOffset:map.PermOffset;
    (map.Record||[]).forEach(f=>add(f[0],base+offset+(phase*map.FaultRecords+record)*map.RecordStride+f[1],f[2],f[3],f[4]));
  }
  return rows;
}

  html+='</tr></thead><tbody>';

    html+='<tr><th scope="row">'+esc(t('mb_'+row.field))+'</th><td>'+esc(range(row.address,row.count))+'</td><td>'+esc(range(row.address-map.AddressBase,row.count))+'</td><td>'+esc(type)+'</td><td>'+esc(row.unit==='degC'?'°C':row.unit==='0/1'?(row.field==='trip_failed'?'0: '+t('alarmInactive')+' · 1: '+t('alarmActive'):'0: '+t('absent')+' · 1: '+t('present')):(row.unit||'—'))+'</td><td><span class="register-access">'+esc(t(row.command?'modMapWrite':'modMapRead'))+'</span></td></tr>';
  });
  return html+'</tbody></table></div>';
}

    else usedFids.push(fid);

  }}else if(page==='device'){[['dev-WebArayuzuPortu',1,65535],['dev-SimKartPin',0,9999],['dev-NtpServerPortu',1,65535],['dev-TimeZone',-12,14],['dev-PeriyodikModemResetPeriyodu',0,720],['dev-WebIlkVeriZamanAsimi',0,3600],['dev-WebBostaKalmaZamanAsimi',0,3600],['dev-IEC104IlkVeriZamanAsimi',0,3600],['dev-IEC104BostaKalmaZamanAsimi',0,3600]].forEach(x=>{if(!validation(x[0],true,x[1],x[2]))ok=false});const pin=getInt('dev-SimKartPin');if(pin!==0&&pin<1000){addressError($('dev-SimKartPin'),t('errPin'));ok=false}}if(!ok)toast(t('tFixVal'),'err');return ok};

// ---------------- MONITORING ----------------
async function readRfFeeder(i){if(loading)return;try{showLoad();const r=await api('/monitor/rf/'+i);hideLoad();if(r.success===false)throw new Error(r.error||t('tFailed'));const d=r.data?.lines?.[0]||r.lines?.[0]||r.data||r;if(!pageCache.rfmon)pageCache.rfmon=[];pageCache.rfmon[i]=d;pageReadAt['rfmon:'+i]=Date.now();renderPage('rfmon');toast(tf('tFeedRead',{n:i+1}),'ok')}catch(e){hideLoad();toast(t('tReadErr')+userError(e),'err')}}
function rfLiveFlag(phase,mask){
  const flags=phase?.Live?.Flags;
  return phase?.HasData&&phase.Online===true&&phase.UptimeStalled!==true&&Number.isInteger(flags)&&flags>=0&&flags<=255?((flags&mask)!==0?1:0):null;
}
function buildRfMonitorTable(d){
  const phases=d.Phases||[];
  const counts=d.FaultCountsSinceStartup;
  const fields=[
    ['Eui64','EUI-64',''],['Online',LNG==='tr'?'RF haberleşmesi':'RF communication',''],
    ['Live.Irms',t('monPhCur'),'A',3],
    ['Live.Flags',t('catEnerji'),'',undefined,1],
    ['Live.Flags',t('catLoad'),'',undefined,2],
    ['Live.VTrip',LNG==='tr'?'Açma kondansatörü':'Trip capacitor','V',3],
    ['Live.VRec',t('mb_harvest_gerilimi'),'V',3],
    ['Live.Temp',t('mb_sicaklik'),'°C'],['Live.RSSI','RSSI','dBm'],
    ['Trip.InstantAmps',LNG==='tr'?'Açma anındaki akım':'Current at trip','A',3],
    ['TripFailedAlarm',t('catTripFailed'),''],
    ['TripFailureLatched',LNG==='tr'?'Operatör onayı':'Operator acknowledgement',''],
    ['LiveAgeMs',LNG==='tr'?'Okuma anındaki son veri yaşı':'Data age at read time','ms']
  ];
  const maintenance=phases.some(p=>p?.UptimeStalled===true||p?.Live?.FsmError===true);
  let html=maintenance?'<p class="hint">'+esc(t('rfMaintenance'))+'</p>':'';
  html+='<div class="table-wrap"><table class="phase-table"><thead><tr><th>'+esc(t('thParam'))+'</th><th>L1</th><th>L2</th><th>L3</th></tr></thead><tbody>';
  if(counts){
    const n=k=>Number.isInteger(counts[k])&&counts[k]>=0?counts[k]:'—';
    const state=counts.IsFinal===true?(LNG==='tr'?'kesin':'confirmed'):(LNG==='tr'?'kesinleşmedi':'provisional');
    const note=LNG==='tr'?`Fider sayımı (bu RTU oturumu, ${state}): kalıcı ${n('Permanent')}, geçici ${n('Temporary')}, belirsiz ${n('Uncertain')}, kapanış bekleyen ${n('Pending')}`:`Feeder counts in this RTU session (${state}): permanent ${n('Permanent')}, temporary ${n('Temporary')}, uncertain ${n('Uncertain')}, awaiting closure ${n('Pending')}`;
    html='<p>'+esc(note)+'</p>'+html;
  }
  for(const [key,label,unit,precision,mask] of fields){
    html+='<tr><td>'+esc(label)+'</td>';
    for(let index=0;index<3;index++){
      const phase=phases[index];
      const measurement=['Live.Irms','Live.VTrip','Live.VRec','Live.Temp'].includes(key);
      const unavailable=measurement&&(phase?.Online!==true||phase?.UptimeStalled===true);
      const independent=['Eui64','Online','TripFailedAlarm','TripFailureLatched'].includes(key);
      const value=unavailable?null:mask?rfLiveFlag(phase,mask):(independent||phase?.HasData)?key.split('.').reduce((v,k)=>v?.[k],phase):null;
      const shown=value==null?t('notAvailable'):key==='Online'?t(value?'rfCurrentData':'rfNoCurrentData'):key==='TripFailedAlarm'?t(value?'alarmActive':'alarmInactive'):key==='TripFailureLatched'?t(value?'ackRequired':'ackNotRequired'):mask?t(value?'present':'absent'):typeof value==='string'?value:fmt(value,unit,precision);
      html+='<td>'+esc(shown)+'</td>';
    }
    html+='</tr>';
  }
  return html+'</tbody></table></div>';
}

async function loadSysLogs(){if(loading)return;const restart=sysLogLines.length>0&&sysLogOffset>=sysLogTotal;if(restart){sysLogLines=[];sysLogOffset=0;const c0=$('sysLogContent');if(c0){c0.classList.add('empty');c0.innerHTML=esc(t('logsPress'))}}try{showLoad();const r=await api('/syslogs?offset='+sysLogOffset+'&limit=30');hideLoad();if(r.success===false)throw new Error(r.error||t('tFailed'));const logs=r.recs?r.recs.split('\n').filter(x=>x.trim()):[];sysLogTotal=Number(r.t)||0;sysLogLines=sysLogLines.concat(logs);sysLogOffset+=logs.length;const c=$('sysLogContent');if(c){c.classList.remove('empty');c.innerHTML=sysLogLines.map(x=>'<div class="log">'+esc(x)+'</div>').join('')}const b=$('sysLogBtn');if(b)b.textContent=(sysLogLines.length>0&&sysLogOffset>=sysLogTotal)?t('btnLogRestart'):t('btnNext');toast(tf('tLogsLoaded',{n:logs.length}),'ok')}catch(e){hideLoad();toast(t('tReadErr')+userError(e),'err')}}

function rebootDevice(){confirmAction(t('tRebootAsk'),async()=>{try{showLoad();const r=await api('/device/reboot',{method:'POST'});hideLoad();if(r.success===false)throw new Error(r.error||t('tFailed'));toast(t('tRebootOk'),'ok')}catch(e){hideLoad();toast(t('tErr')+userError(e),'err')}},'btnReboot')}
const trmTs=()=>{const n=new Date(),p=(v,l=2)=>String(v).padStart(l,'0');return p(n.getHours())+':'+p(n.getMinutes())+':'+p(n.getSeconds())+'.'+p(n.getMilliseconds(),3)};
function trmAppend(text,cls){const out=$('trmOut');if(!out)return;const e=document.createElement('div');e.className='term-line '+cls;e.innerHTML='<span class="term-ts">'+trmTs()+'</span>';const t2=document.createElement('span');t2.textContent=(cls==='cmd'?'> ':'< ')+text;e.appendChild(t2);out.appendChild(e);out.scrollTop=out.scrollHeight}
async function trmSend(){
  if(terminalBusy)return;
  const inp=$('trmCmd');if(!inp||!inp.value)return;
  const cmd=inp.value;inp.value='';trmAppend(cmd,'cmd');terminalBusy=true;inp.disabled=true;
  try{
    const post=await api('/serial',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tx:cmd})});
    let received=false;
    if(post.rx){trmAppend(post.rx,'res');received=true}
    else if(post.pending){
      const deadline=Date.now()+12000;
      while(Date.now()<deadline){
        await new Promise(resolve=>setTimeout(resolve,1000));
        const reply=await api('/serial',{method:'GET'});
        if(reply.rx){trmAppend(reply.rx,'res');received=true;break}
      }
    }
    if(!received)trmAppend(t('commandUnknown'),'res');
  }catch(error){trmAppend(t('tErr')+userError(error),'res')}
  finally{terminalBusy=false;inp.disabled=false;inp.focus()}
}
function trmClr(){if($('trmOut'))$('trmOut').innerHTML=''}

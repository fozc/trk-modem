<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TSB23 Device Configuration</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>⚡</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f4f6f8;--panel:#fff;--line:#e4e8ed;--text:#1f2937;--muted:#6b7280;--blue:#1769aa;--blue2:#e8f2fb;--green:#198754;--green2:#eaf7ef;--red:#dc3545;--red2:#fff0f1;--nav:#142b43;--nav2:#1d5d8f;--shadow:0 2px 10px rgba(15,23,42,.06)}
html,body{height:100%;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:13px}
.app{display:flex;height:100vh}.sidebar{width:228px;flex:0 0 228px;background:var(--nav);color:#fff;display:flex;flex-direction:column;overflow-y:auto}.brand{padding:19px 18px;background:var(--nav2);font-size:17px;font-weight:700;letter-spacing:.2px}.menu{padding:10px 8px;flex:1}.mi{padding:11px 13px;margin:3px 0;border-radius:7px;cursor:pointer;color:#dbe7f2;font-weight:500;border-left:3px solid transparent;transition:.15s}.mi:hover{background:rgba(255,255,255,.07);color:#fff}.mi.a{background:rgba(53,145,210,.22);border-left-color:#75b9e8;color:#fff}.logout{padding:10px;border-top:1px solid rgba(255,255,255,.09)}
.main{min-width:0;flex:1;display:flex;flex-direction:column}.header{height:66px;flex:0 0 66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.header h1{font-size:20px;color:#173b5f;font-weight:650}.header .hint{font-size:12px;color:var(--muted)}.content{flex:1;overflow-y:auto;padding:18px 22px 28px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}.card-head{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.card-head h3{font-size:14px;color:#1c527d;font-weight:650}.card-head .sub{font-size:11px;color:var(--muted)}.card-body{padding:15px}.card-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.page-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.gt{gap:8px}.field{min-width:0}.field label{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:#4b5563;margin:0 0 5px}.fld-hint{font-size:9px;font-weight:600;color:#8b96a3;background:#eef2f6;padding:1px 6px;border-radius:10px;letter-spacing:.3px;white-space:nowrap}.field input{width:100%;height:34px;padding:7px 9px;border:1px solid #cfd6de;border-radius:6px;background:#fff;color:#1f2937;font:inherit;outline:none}.field select{width:100%;height:34px;padding:0 9px;border:1px solid #cfd6de;border-radius:6px;background:#fff;color:#1f2937;font:inherit;outline:none;cursor:pointer}.field input:focus{border-color:#5a9dcc;box-shadow:0 0 0 2px rgba(23,105,170,.1)}.field input:disabled{background:#f1f3f5;color:#6b7280}.field input.dirty{border-color:#e0a100;background:#fffaf0;box-shadow:0 0 0 2px rgba(224,161,0,.08)}.field input.invalid{border-color:var(--red);background:var(--red2)}.dirty-dot{width:6px;height:6px;border-radius:50%;background:#e0a100;display:inline-block}.err{min-height:14px;margin-top:3px;color:var(--red);font-size:10px}.readonly{background:#f6f7f9!important}
.check{display:flex;align-items:center;gap:7px;min-height:34px;font-size:12px;color:#374151;font-weight:600}.check input{width:16px;height:16px}.dirty-row{background:#fffaf0!important}.dirty-cell{box-shadow:inset 0 0 0 1px #e0a100;background:#fffaf0!important}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:7px}.table{width:100%;border-collapse:collapse;min-width:850px}.table th{background:#f1f5f9;color:#40566b;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.35px;padding:8px 7px;border-bottom:1px solid #dfe5ea;position:sticky;top:0;z-index:1}.table td{padding:6px 7px;border-bottom:1px solid #edf0f2;vertical-align:middle}.table tr:last-child td{border-bottom:0}.table input[type=number]{width:100%;min-width:72px;height:30px;padding:5px 6px;border:1px solid #cfd6de;border-radius:5px;font:inherit}.table input[type=number]:focus{outline:none;border-color:#5a9dcc}.table input.dirty{border-color:#e0a100;background:#fffaf0}.table input.invalid{border-color:var(--red);background:var(--red2)}
.btn{border:0;border-radius:6px;padding:8px 14px;font-size:11px;font-weight:700;cursor:pointer;transition:.15s}.btn:disabled{opacity:.45;cursor:not-allowed}.btn-read{background:var(--blue);color:#fff}.btn-read:hover:not(:disabled){background:#12578d}.btn-save{background:var(--green);color:#fff}.btn-save:hover:not(:disabled){background:#157347}.btn-danger{background:var(--red);color:#fff}.btn-muted{background:#e9edf1;color:#394957}.btn-muted:hover:not(:disabled){background:#dce2e7}.btn-small{padding:6px 10px;font-size:10px}.read-state{font-size:10px;color:var(--muted)}.read-state.loaded{color:var(--green)}.read-state.dirty{color:#a86e00}.read-state:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#aeb7c0;margin-right:5px}.read-state.loaded:before{background:var(--green)}.read-state.dirty:before{background:#e0a100}
.notice{padding:10px 12px;border-radius:7px;background:#f5f7f9;color:#64748b;font-size:12px;margin-bottom:12px}.notice strong{color:#334155}.empty{padding:28px;text-align:center;color:#8a94a0}.status-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.status-item{padding:11px 12px;border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:7px;background:#fff}.status-item.full{grid-column:1/-1}.status-item .k{font-size:10px;color:var(--muted);text-transform:uppercase}.status-item .v{font-size:14px;font-weight:650;margin-top:4px;color:#263b4d}.kv-list{display:flex;flex-direction:column}.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 14px;font-size:12px;border-bottom:1px solid #eef1f4}.kv:last-child{border-bottom:0}.kv:nth-child(even){background:#f8fafc}.kv .k{color:var(--muted);font-weight:600}.kv .v{color:#1f2d3d;font-weight:650;text-align:right;font-variant-numeric:tabular-nums}
.led{display:inline-flex;align-items:center;gap:5px;margin-right:7px;font-size:11px}.led i{width:9px;height:9px;border-radius:50%;display:inline-block;background:#adb5bd}.led.on i{background:#20a464}.led.off i{background:#adb5bd}.tabbar{display:flex;gap:4px;overflow:auto;border-bottom:1px solid var(--line);margin-bottom:12px}.tab{padding:8px 12px;border:0;background:transparent;color:#64748b;font-weight:650;font-size:11px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}.tab:hover{color:#1769aa}.tab.active{color:#1769aa;border-bottom-color:#1769aa;background:#f7fbfe}.pane{display:none}.pane.active{display:block}.phase-table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:12px}.phase-table th,.phase-table td{padding:6px 10px;border-bottom:1px solid #eef1f4;word-break:break-word}.phase-table th{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;font-weight:600;background:#f8fafc}.phase-table th:first-child{text-align:left;width:34%}.phase-table th:not(:first-child){text-align:center}.phase-table td{color:#1f2d3d}.phase-table td:first-child{color:var(--muted);font-weight:600;text-align:left}.phase-table td:not(:first-child){font-weight:650;text-align:center;font-variant-numeric:tabular-nums}.phase-head{font-size:11px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.4px;margin:0 0 8px;padding:0 0 5px;border-bottom:2px solid var(--blue2)}.warn{padding:7px 9px;border-left:3px solid #d98c00;background:#fff8e8;color:#8a5a00;border-radius:4px;font-size:11px;margin-bottom:8px}.log{background:#fafbfc;border:1px solid var(--line);border-left:3px solid #5a9dcc;padding:9px 11px;margin:5px 0;border-radius:5px;font-family:Consolas,"Courier New",monospace;font-size:11px;line-height:1.45;word-break:break-word}.terminal{height:calc(100vh - 122px);background:#171b20;border-radius:9px;overflow:hidden;display:flex;flex-direction:column;color:#d8dee6}.terminal-out{flex:1;overflow:auto;padding:12px;font:12px/1.5 Consolas,"Courier New",monospace;white-space:pre-wrap;word-break:break-all}.term-line{margin-bottom:6px;padding-left:8px;border-left:2px solid #3b4652}.term-line.cmd{border-left-color:#4d9ad4}.term-line.res{border-left-color:#35a56f}.term-ts{color:#718096;font-size:10px;margin-right:7px}.terminal-in{display:flex;gap:7px;padding:8px;background:#20252b;border-top:1px solid #303740}.terminal-in input{flex:1;background:#171b20;border:1px solid #3c4650;color:#e5e7eb;border-radius:5px;padding:8px 10px;font:12px Consolas,"Courier New",monospace;outline:none}.terminal-in input:focus{border-color:#4d9ad4}
.toast{position:fixed;top:16px;right:16px;z-index:10000;padding:10px 14px;border-radius:7px;color:#fff;font-size:12px;font-weight:600;box-shadow:0 4px 15px rgba(0,0,0,.18);animation:toastin .2s ease-out}.toast.ok{background:#198754}.toast.err{background:#dc3545}.toast.info{background:#1769aa}@keyframes toastin{from{transform:translateY(-8px);opacity:0}to{transform:translateY(0);opacity:1}}
.loading{position:fixed;inset:0;background:rgba(15,23,42,.34);z-index:9998;display:flex;align-items:center;justify-content:center}.spinner{width:34px;height:34px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .75s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.52);z-index:9999;display:flex;align-items:center;justify-content:center}.modal-card{background:#fff;width:min(390px,calc(100vw - 30px));border-radius:10px;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.22)}.modal-card h3{font-size:16px;margin-bottom:14px;color:#173b5f}.modal-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:12px}
@media(max-width:850px){.sidebar{width:190px;flex-basis:190px}.header{padding:0 15px}.content{padding:14px}.g2,.g3,.g4{grid-template-columns:1fr}.header .hint{display:none}}
@media(max-width:620px){.sidebar{width:58px;flex-basis:58px}.brand{font-size:0;text-align:center;padding:19px 5px}.brand:after{content:'⚡';font-size:18px}.mi{font-size:0;text-align:center;padding:12px 5px;border-left:0;border-bottom:2px solid transparent}.mi.a{border-bottom-color:#75b9e8}.logout .btn{font-size:0}.logout .btn:after{content:'↪';font-size:16px}.header h1{font-size:16px}}
</style>
</head>
<body>
<div id="initialLoading" class="loading"><div class="spinner"></div></div>
<div id="loginModal" class="modal" style="display:none">
  <div class="modal-card">
    <h3>Device Login</h3>
    <div class="field"><label>Username</label><input id="loginUser" type="text" maxlength="16" autocomplete="username"></div>
    <div class="field" style="margin-top:10px"><label>Password</label><input id="loginPass" type="password" maxlength="16" autocomplete="current-password"></div>
    <div id="loginErr" class="err"></div>
    <div class="modal-actions"><button class="btn btn-read" onclick="doLogin()">Login</button></div>
  </div>
</div>
<div class="app">
  <aside class="sidebar">
    <div class="brand">Device Config</div>
    <nav class="menu" id="menu"></nav>
    <div class="logout"><button class="btn btn-danger" style="width:100%" onclick="doLogout()">Logout</button></div>
  </aside>
  <main class="main">
    <header class="header"><h1 id="title">Device</h1><div class="hint">Data is read only when requested · Web UI <span id="webUiVer">{{WEB_VERSION}}</span></div></header>
    <section class="content" id="body"></section>
  </main>
</div>

<script>
const CFG_TOAST_DURATION_MS=4000;
const CFG_HTTP_REQUEST_TIMEOUT_MS=30000;
const CFG_SESSION_TIMEOUT_MS=15*60*1000;
const FEEDER_COUNT=7;    // store/array length (backend MAX_POWER_LINE_COUNT)
const FEEDER_TABS=4;     // visible feeder tabs, first stage - single switch point for ALL pages
let s_sessionToken=null,loading=false,curId=null;
const pageCache={};
const dirtyPages={};
const rfFaultCache={};
let faultFeeder=0,sysLogOffset=0,terminalBusy=false,sessionTimeout=null;
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmtEpoch=v=>v?new Date(v*1000).toLocaleString('tr-TR',{timeZone:'UTC'}):'No data';
const fmtLifetime=v=>{if(v===undefined||v===null||v==='')return '-';const s=parseInt(v,10)||0;const p=n=>String(n).padStart(2,'0');return String(Math.floor(s/86400)).padStart(4,'0')+':'+p(Math.floor(s/3600)%24)+':'+p(Math.floor(s/60)%60)+':'+p(s%60)};
const fmt=(v,u,dec)=>{if(v===undefined||v===null||v==='')return '-';let s=dec!==undefined?parseFloat(v).toFixed(dec):String(v);return u?s+' '+u:s};
const toast=(m,t='info')=>{const e=document.createElement('div');e.className='toast '+t;e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),CFG_TOAST_DURATION_MS)};
const showLoad=()=>{if(loading)return;loading=true;const e=document.createElement('div');e.id='requestLoading';e.className='loading';e.innerHTML='<div class="spinner"></div>';document.body.appendChild(e);document.querySelectorAll('button').forEach(b=>b.disabled=true)};
const hideLoad=()=>{loading=false;$('requestLoading')?.remove();document.querySelectorAll('button').forEach(b=>b.disabled=false)};
const confirmAction=(msg,fn)=>{const o=document.createElement('div');o.className='modal';o.innerHTML='<div class="modal-card"><h3>Confirm</h3><p style="color:#64748b;line-height:1.5;margin-bottom:12px">'+esc(msg)+'</p><div class="modal-actions"><button class="btn btn-muted" id="cancelConfirm">Cancel</button><button class="btn btn-danger" id="okConfirm">Confirm</button></div></div>';document.body.appendChild(o);$('cancelConfirm').onclick=()=>o.remove();$('okConfirm').onclick=()=>{o.remove();fn()}};

// ---------------- HTTP / SESSION ----------------
const api=async(url,opt={})=>{
  const skipAuthCheck=!!opt.skipAuthCheck; delete opt.skipAuthCheck;
  if(s_sessionToken)url+=(url.includes('?')?'&':'?')+'t='+encodeURIComponent(s_sessionToken);
  const ctrl=new AbortController(),tid=setTimeout(()=>ctrl.abort(),CFG_HTTP_REQUEST_TIMEOUT_MS);
  try{
    const r=await fetch(url,{...opt,signal:ctrl.signal});clearTimeout(tid);
    if(r.status===401&&!skipAuthCheck){s_sessionToken=null;showLoginModal();toast('Authentication required','info');throw new Error('Authentication required')}
    if(!r.ok)throw new Error('HTTP '+r.status);
    return await r.json();
  }catch(e){clearTimeout(tid);if(!skipAuthCheck&&e.name!=='Error'&&!!s_sessionToken)toast('Connection error, please retry','err');throw e}
};
const showLoginModal=()=>{const m=$('loginModal');m.style.display='flex';$('loginPass').value='';setTimeout(()=>$('loginUser')?.focus(),80);if(sessionTimeout){clearTimeout(sessionTimeout);sessionTimeout=null}};
const hideLoginModal=()=>{$('loginModal').style.display='none'};
const startSessionTimeout=()=>{if(sessionTimeout)clearTimeout(sessionTimeout);sessionTimeout=setTimeout(()=>{toast('Session expired','info');doLogout()},CFG_SESSION_TIMEOUT_MS)};
const resetSessionTimeout=()=>{if(s_sessionToken)startSessionTimeout()};
const doLogin=async()=>{const username=$('loginUser').value.substring(0,16),password=$('loginPass').value.substring(0,16);$('loginErr').textContent='';if(!username||!password){$('loginErr').textContent='Please enter credentials';return}$('loginPass').value='';try{showLoad();const r=await api('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password}),skipAuthCheck:true});hideLoad();if(r.success===true){s_sessionToken=r.token||null;if(s_sessionToken)sessionStorage.setItem('sessionToken',s_sessionToken);hideLoginModal();toast('Login successful','ok');startSessionTimeout()}else{$('loginErr').textContent=r.error||'Invalid credentials';$('loginPass').focus()}}catch(e){hideLoad();$('loginErr').textContent='Login failed';$('loginPass').focus()}};
const doLogout=async()=>{try{await api('/auth/logout',{method:'POST',skipAuthCheck:true})}catch(e){}s_sessionToken=null;sessionStorage.removeItem('sessionToken');if(sessionTimeout)clearTimeout(sessionTimeout);showLoginModal();toast('Logged out successfully','info')};

// ---------------- DIRTY STATE ----------------
const setDirty=(page,el,dirty)=>{if(!dirtyPages[page])dirtyPages[page]=new Set();if(dirty)dirtyPages[page].add(el);else dirtyPages[page].delete(el);el.classList.toggle('dirty',dirty);const dot=el.closest('.field')?.querySelector('.dirty-dot');if(dot)dot.style.display=dirty?'inline-block':'none';updatePageState(page)};
const clearDirty=page=>{(dirtyPages[page]||new Set()).forEach(el=>el.classList.remove('dirty'));dirtyPages[page]=new Set();document.querySelectorAll('#body .dirty-dot').forEach(e=>e.style.display='none');updatePageState(page)};
const hasDirty=page=>(dirtyPages[page]?.size||0)>0;
const updatePageState=page=>{const e=$('state-'+page);if(!e)return;e.className='read-state '+(hasDirty(page)?'dirty':pageCache[page]?'loaded':'');e.textContent=hasDirty(page)?'Unsaved changes':pageCache[page]?'Loaded from device':'Not read yet'};
const bindDirty=(page,root=document)=>{root.querySelectorAll('[data-dirty]').forEach(el=>{const original=el.dataset.original;const current=el.type==='checkbox'?String(el.checked):el.value;el.addEventListener('input',()=>setDirty(page,el,(el.type==='checkbox'?String(el.checked):el.value)!==el.dataset.original));el.addEventListener('change',()=>setDirty(page,el,(el.type==='checkbox'?String(el.checked):el.value)!==el.dataset.original));if(current!==original)setDirty(page,el,true)})};
const markOriginals=root=>root.querySelectorAll('[data-dirty]').forEach(el=>{el.dataset.original=el.type==='checkbox'?String(el.checked):el.value;el.classList.remove('dirty')});

// ---------------- COMMON FORM HELPERS ----------------
const numField=(id,label,v,min,max,ro=false,unit='',stp='')=>{const rng=(!ro&&min!=null&&max!=null)?`<span class="fld-hint">${min}–${max}${unit?' '+esc(unit):''}</span>`:(!ro&&unit?`<span class="fld-hint">${esc(unit)}</span>`:'');return `<div class="field"><label>${esc(label)}${rng}${!ro?'<span class="dirty-dot" style="display:none"></span>':''}</label><input id="${id}" data-dirty="1" type="number" value="${v??''}" min="${min??''}" max="${max??''}"${stp?` step="${stp}"`:''} ${ro?'disabled class="readonly"':''}><div class="err" id="err-${id}"></div></div>`};
const textField=(id,label,v,max,ro=false)=>{const rng=(!ro&&max!=null&&max!=='')?`<span class="fld-hint">max ${max}</span>`:'';return `<div class="field"><label>${esc(label)}${rng}${!ro?'<span class="dirty-dot" style="display:none"></span>':''}</label><input id="${id}" data-dirty="1" type="text" value="${esc(v??'')}" maxlength="${max??''}" ${ro?'disabled class="readonly"':''}><div class="err" id="err-${id}"></div></div>`};
const checkField=(id,label,v)=>`<div class="field"><label>&nbsp;</label><label class="check"><input id="${id}" data-dirty="1" type="checkbox" ${v?'checked':''}><span>${esc(label)}</span><span class="dirty-dot" style="display:none"></span></label></div>`;
const feederField=(prefix,key,i,label,v,min=1,max=65535)=>`<div class="field"><label>${esc(label)}</label><input type="number" data-id="${prefix}" data-key="${key}" data-i="${i}" data-dirty="1" value="${v??0}" min="${min}" max="${max}"><div class="err"></div></div>`;
const feederCheck=(prefix,i,label,checked)=>`<div class="field"><label class="check"><input type="checkbox" data-id="${prefix}" data-key="inUse" data-i="${i}" data-dirty="1" ${checked?'checked':''}><span>${esc(label)}</span></label></div>`;
const selectField=(id,label,value,opts)=>{const all=(opts.map(String).includes(String(value))?opts:[value,...opts]);return `<div class="field"><label>${esc(label)}</label><select id="${id}" data-dirty="1">${all.map(o=>`<option value="${o}" ${String(o)===String(value)?'selected':''}>${o}</option>`).join('')}</select><div class="err" id="err-${id}"></div></div>`};
const selectFieldL=(id,label,value,opts)=>{if(!opts.map(o=>String(o[0])).includes(String(value)))opts=[[value,String(value)],...opts];return `<div class="field"><label>${esc(label)}</label><select id="${id}" data-dirty="1">${opts.map(o=>`<option value="${o[0]}" ${String(o[0])===String(value)?'selected':''}>${esc(o[1])}</option>`).join('')}</select><div class="err" id="err-${id}"></div></div>`};
/* shared feeder scaffolding: tab bar + pane wrapper (tabs visible up to
 * FEEDER_TABS; panes for all FEEDER_COUNT kept in DOM so POST data of
 * hidden feeders is preserved unchanged) */
const feederTabs=(sel,act=0)=>'<div class="tabbar">'+Array.from({length:FEEDER_TABS},(_,i)=>'<button class="tab '+(i===act?'active':'')+'" onclick="'+sel+'('+i+')">Feeder '+(i+1)+'</button>').join('')+'</div>';
const paneOpen=(pfx,i)=>'<div id="'+pfx+'-pane-'+i+'" class="pane '+(i===0?'active':'')+'"'+(i>=FEEDER_TABS?' style="display:none"':'')+'>';
const sectionHead=(title,page,desc='')=>`<div class="card-head"><div><h3>${esc(title)}</h3>${desc?`<div class="sub">${esc(desc)}</div>`:''}</div></div>`;
const pageHead=(title,page,desc='',rw=true)=>`<div class="card" style="margin-bottom:14px"><div class="card-head"><div><h3>${esc(title)}</h3>${desc?`<div class="sub">${esc(desc)}</div>`:''}</div><div class="card-actions"><span id="state-${page}" class="read-state">Not read yet</span><button class="btn btn-read btn-small" onclick="readPage('${page}')">Read</button>${rw?`<button class="btn btn-save btn-small" onclick="savePage('${page}')">Save</button>`:''}</div></div></div>`;
const emptyCard=(title,page,desc='')=>`<div class="card"><div class="card-head"><div><h3>${esc(title)}</h3>${desc?`<div class="sub">${esc(desc)}</div>`:''}</div><div class="card-actions"><span id="state-${page}" class="read-state">Not read yet</span><button class="btn btn-read btn-small" onclick="readPage('${page}')">Read</button></div></div><div class="card-body"><div class="empty">Press <strong>Read</strong> to load current values from the device.</div></div></div>`;
const getInt=id=>{const v=$(id)?.value;return v===''?0:parseInt(v,10)||0};
const getFloat=id=>{const v=$(id)?.value;return v===''?0:parseFloat(v)||0};
const getText=id=>$(id)?.value||'';
const getBool=id=>!!$(id)?.checked;
const validation=(id,req,min,max)=>{const el=$(id);if(!el)return true;const err=$('err-'+id);if(err)err.textContent='';el.classList.remove('invalid');const v=el.value;if(req&&v===''){if(err)err.textContent='Required';el.classList.add('invalid');return false}if(el.type==='number'&&v!==''){const n=Number(v);if(!Number.isFinite(n)||(min!==undefined&&n<min)||(max!==undefined&&n>max)){if(err)err.textContent='Range: '+min+' .. '+max;el.classList.add('invalid');return false}}return true};

function rfAssignEui(eui,phase){const fsel=$('rf-assign-f-'+eui);const i=fsel?parseInt(fsel.value,10):0;const key={R:'R_DEVICEID',S:'S_DEVICEID',T:'T_DEVICEID'}[phase];const el=$('rf-'+key+'-'+i);if(!el){toast('Target field not found','err');return}el.value=eui.toUpperCase();el.dispatchEvent(new Event('input'));selectRfTab(i);toast('EUI-64 assigned to Feeder '+(i+1)+' phase '+phase,'ok')}

function buildDiscoveryTable(un){const dev=[['R_DEVICEID','L1'],['S_DEVICEID','L2'],['T_DEVICEID','L3']];return '<div class="table-wrap"><table class="phase-table"><thead><tr><th>EUI-64</th><th>Assign to</th></tr></thead><tbody>'+un.map(u=>'<tr><td>'+esc(u.EUI64)+'</td><td><select id="rf-assign-f-'+esc(u.EUI64)+'">'+Array.from({length:FEEDER_TABS},(_,k)=>'<option value="'+k+'">Feeder '+(k+1)+'</option>').join('')+'</select> '+dev.map(dv=>'<button class="btn btn-read btn-small" onclick="rfAssignEui(\''+esc(u.EUI64)+'\',\''+dv[0][0]+'\')">'+dv[1]+'</button>').join(' ')+'</td></tr>').join('')+'</tbody></table></div>'}

function buildFaults(r){const phases=[['L1T','L1P','L1'],['L2T','L2P','L2'],['L3T','L3P','L3']];let h='<div class="grid g3">';const tc=r.tc||[0,0,0],pc=r.pc||[0,0,0];phases.forEach((p,i)=>{h+='<div class="card" style="box-shadow:none;border:1px solid var(--line)"><div class="card-body"><h3 style="font-size:13px;margin-bottom:8px">'+p[2]+'</h3><div class="sub" style="font-weight:700;color:#a86e00;margin-bottom:4px">Temporary ('+tc[i]+')</div>';const t=r[p[0]]?r[p[0]].split('\n').filter(x=>x.trim()):[];h+=t.length?t.map(x=>'<div class="log" style="border-left-color:#d98c00">'+esc(x)+'</div>').join(''):'<div class="empty" style="padding:8px">No records</div>';h+='<div class="sub" style="font-weight:700;color:#a33;margin:10px 0 4px">Permanent ('+pc[i]+')</div>';const pRec=r[p[1]]?r[p[1]].split('\n').filter(x=>x.trim()):[];h+=pRec.length?pRec.map(x=>'<div class="log" style="border-left-color:#b33">'+esc(x)+'</div>').join(''):'<div class="empty" style="padding:8px">No records</div>';h+='</div></div>'});return h+'</div>'}

const readPage=async(page)=>{if(loading)return;try{showLoad();let r;if(page==='iec104')r=await api('/config/iec104');else if(page==='modbus')r=await api('/config/modbus');else if(page==='rf')r=await api('/config/rf');else if(page==='board')r=await api('/status/board');else if(page==='device')r=await api('/config/device');else return;hideLoad();if(r.success===false)throw new Error(r.error||'Read failed');const d=r.data||r;pageCache[page]=d;renderPage(page,d);toast('Read successful','ok')}catch(e){hideLoad();toast('Read error: '+e.message,'err')}};
const savePage=async(page)=>{if(loading)return;if(page==='device')return saveDevice();if(!pageCache[page]){toast('Read the current configuration first','err');return}if(!validatePage(page))return;const d=extractPage(page);try{showLoad();let r;if(page==='iec104')r=await api('/config/iec104',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});else if(page==='modbus')r=await api('/config/modbus',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});else if(page==='rf')r=await api('/config/rf',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});hideLoad();if(r.success===false)throw new Error(r.error||'Save failed');pageCache[page]=d;clearDirty(page);toast('Saved successfully','ok')}catch(e){hideLoad();toast('Save error: '+e.message,'err')}};
const validatePage=page=>{let ok=true;if(page==='iec104'){[['iec-Port',1,65535],['iec-PeriodicSend',0,86400],['iec-T0',30,255],['iec-T1',30,255],['iec-T2',30,255],['iec-T3',30,255],['iec-K',64,255],['iec-W',32,255],['iec-OriginatorAddr',1,65535],['iec-CommonAddr',1,255],['iec-SBOTimeout',10000,100000],['iec-AkuUyarisi',1,16777215],['iec-ModemReset',1,16777215]].forEach(x=>{if(!validation(x[0],true,x[1],x[2]))ok=false});for(let i=0;i<FEEDER_COUNT;i++){const cb=document.querySelector('[data-id="iec"][data-key="inUse"][data-i="'+i+'"]');if(cb&&cb.checked===false)continue;document.querySelectorAll('[data-id="iec"][data-i="'+i+'"]:not([data-key="inUse"])').forEach(e=>{if(!validationEl(e,1,16777215))ok=false})}}else if(page==='modbus'){if(!validation('mod-CihazID',true,1,247))ok=false;if(!validation('mod-BaudRate',true,1200,921600))ok=false;for(let i=0;i<FEEDER_COUNT;i++){const cb=document.querySelector('[data-id="mod"][data-key="inUse"][data-i="'+i+'"]');if(cb&&cb.checked===false)continue;document.querySelectorAll('[data-id="mod"][data-i="'+i+'"]:not([data-key="inUse"])').forEach(e=>{if(!validationEl(e,1,65535))ok=false})}}else if(page==='rf'){const rfInt=[['HatID',0,7],['ZoneID',0,7],['SetEdilebilirAcmaArizaSayisi',1,4],['OluHatAkimiDogrulamaSuresi',80,200],['YenilenmeSifirlamaSuresi',10,300]];const rfFloat=[['SistemNominalAkimi',2,200],['SetEdilebilirActirmaEsikAkimi',2.4,240],['ArtimliAkimEsigi',250,2500],['HatKopukHatBosta',0.3,5]];const euiRe=/^[0-9A-Fa-f]{16}$/;const usedFids=[];const euiSeen={};
  for(let i=0;i<FEEDER_COUNT;i++){const cb=$('rf-inUse-'+i);const inUse=!cb||cb.checked;
    ['R_DEVICEID','S_DEVICEID','T_DEVICEID'].forEach(k=>{const el=$('rf-'+k+'-'+i);if(!el)return;const v=(el.value||'').trim();const err=$('err-rf-'+k+'-'+i);el.classList.remove('invalid');if(err)err.textContent='';if(v==='')return;
      if(!euiRe.test(v)){el.classList.add('invalid');if(err)err.textContent='16 hex characters or empty';ok=false}
      else{const key=v.toUpperCase();if(euiSeen[key]!==undefined){el.classList.add('invalid');if(err)err.textContent='Already used: '+euiSeen[key];ok=false}else euiSeen[key]='Feeder '+(i+1)}});
    if(!inUse)continue;
    rfInt.forEach(f=>{if(!validation('rf-'+f[0]+'-'+i,true,f[1],f[2]))ok=false});
    rfFloat.forEach(f=>{if(!validation('rf-'+f[0]+'-'+i,true,f[1],f[2]))ok=false});
    const fid=getInt('rf-HatID-'+i);
    if(fid===0){const el=$('rf-HatID-'+i),err=$('err-rf-HatID-'+i);el.classList.add('invalid');if(err)err.textContent='0 = unprovisioned; set 1-'+FEEDER_TABS+' or uncheck Use';ok=false}
    else if(usedFids.includes(fid)){const el=$('rf-HatID-'+i),err=$('err-rf-HatID-'+i);el.classList.add('invalid');if(err)err.textContent='Duplicate Feeder ID';ok=false}
    else usedFids.push(fid);
    const nom=parseFloat($('rf-SistemNominalAkimi-'+i)?.value),ia=parseFloat($('rf-SetEdilebilirActirmaEsikAkimi-'+i)?.value);
    if(Number.isFinite(nom)&&Number.isFinite(ia)&&ia<nom*1.2){const el=$('rf-SetEdilebilirActirmaEsikAkimi-'+i),err=$('err-rf-SetEdilebilirActirmaEsikAkimi-'+i);el.classList.add('invalid');if(err)err.textContent='Must be >= 1.2 x Nominal ('+(nom*1.2).toFixed(1)+' A)';ok=false}
  }}else if(page==='device'){[['dev-WebArayuzuPortu',1,65535],['dev-SimKartPin',0,9999],['dev-NtpServerPortu',1,65535],['dev-TimeZone',-12,14],['dev-PeriyodikModemResetPeriyodu',0,4294967295],['dev-WebIlkVeriZamanAsimi',0,3600],['dev-WebBostaKalmaZamanAsimi',0,3600],['dev-IEC104IlkVeriZamanAsimi',0,3600],['dev-IEC104BostaKalmaZamanAsimi',0,3600]].forEach(x=>{if(!validation(x[0],true,x[1],x[2]))ok=false})}if(!ok)toast('Fix validation errors first','err');return ok};
const validationEl=(el,min,max)=>{el.classList.remove('invalid');const n=Number(el.value);if(el.value===''||!Number.isFinite(n)||n<min||n>max){el.classList.add('invalid');return false}return true};

function extractPage(page){if(page==='iec104'){const d={};[['Port','iec-Port'],['PeriodicSend','iec-PeriodicSend'],['T0','iec-T0'],['T1','iec-T1'],['T2','iec-T2'],['T3','iec-T3'],['K','iec-K'],['W','iec-W'],['OriginatorAddr','iec-OriginatorAddr'],['CommonAddr','iec-CommonAddr'],['SBOTimeout','iec-SBOTimeout'],['AkuUyarisi','iec-AkuUyarisi'],['ModemReset','iec-ModemReset']].forEach(x=>d[x[0]]=getInt(x[1]));d.SBO=getBool('iec-SBO');const h={};const keys=['inUse','IOA_R_ArizaAkimi','IOA_S_ArizaAkimi','IOA_T_ArizaAkimi','IOA_R_ArizaSuresi','IOA_S_ArizaSuresi','IOA_T_ArizaSuresi','IOA_R_ArizaTuru','IOA_S_ArizaTuru','IOA_T_ArizaTuru','IOA_R_AnlikAkim','IOA_S_AnlikAkim','IOA_T_AnlikAkim','IOA_R_EnerjiVarYok','IOA_S_EnerjiVarYok','IOA_T_EnerjiVarYok','IOA_R_NominalAkimVarYok','IOA_S_NominalAkimVarYok','IOA_T_NominalAkimVarYok','IOA_R_RfhabVarYok','IOA_S_RfhabVarYok','IOA_T_RfhabVarYok'];keys.forEach(k=>h[k]=[]);document.querySelectorAll('[data-id="iec"]').forEach(e=>h[e.dataset.key].push(e.type==='checkbox'?e.checked:getIntEl(e)));d.Hatlar=h;return d}
  if(page==='modbus'){const d={CihazID:getInt('mod-CihazID'),BaudRate:getInt('mod-BaudRate')},h={};const keys=['inUse','ADDR_R_ArizaAkimi','ADDR_S_ArizaAkimi','ADDR_T_ArizaAkimi','ADDR_R_ArizaSuresi','ADDR_S_ArizaSuresi','ADDR_T_ArizaSuresi','ADDR_R_ArizaTuru','ADDR_S_ArizaTuru','ADDR_T_ArizaTuru','ADDR_R_AnlikAkim','ADDR_S_AnlikAkim','ADDR_T_AnlikAkim','ADDR_R_EnerjiVarYok','ADDR_S_EnerjiVarYok','ADDR_T_EnerjiVarYok','ADDR_R_NominalAkimVarYok','ADDR_S_NominalAkimVarYok','ADDR_T_NominalAkimVarYok','ADDR_R_RfhabVarYok','ADDR_S_RfhabVarYok','ADDR_T_RfhabVarYok'];keys.forEach(k=>h[k]=[]);document.querySelectorAll('[data-id="mod"]').forEach(e=>h[e.dataset.key].push(e.type==='checkbox'?e.checked:getIntEl(e)));d.Hat=h;return d}
  if(page==='rf'){const d={};const iKeys=['HatID','ZoneID','SetEdilebilirAcmaArizaSayisi','OluHatAkimiDogrulamaSuresi','YenilenmeSifirlamaSuresi'];const fKeys=['SistemNominalAkimi','SetEdilebilirActirmaEsikAkimi','ArtimliAkimEsigi','HatKopukHatBosta'];const sKeys=['R_DEVICEID','S_DEVICEID','T_DEVICEID'];['inUse','CalismaModu','HatFrekansi',...iKeys,...fKeys,...sKeys].forEach(k=>d[k]=[]);
    for(let i=0;i<FEEDER_COUNT;i++){d.inUse[i]=getBool('rf-inUse-'+i);d.CalismaModu[i]=getInt('rf-CalismaModu-'+i);d.HatFrekansi[i]=getInt('rf-HatFrekansi-'+i);iKeys.forEach(k=>d[k][i]=getInt('rf-'+k+'-'+i));fKeys.forEach(k=>d[k][i]=getFloat('rf-'+k+'-'+i));sKeys.forEach(k=>d[k][i]=getText('rf-'+k+'-'+i).trim().toUpperCase())}return d}
  if(page==='device')return extractDevice();return {};
}
const getIntEl=e=>e.value===''?0:parseInt(e.value,10)||0;
function extractDevice(){return {WebArayuzuPortu:getInt('dev-WebArayuzuPortu'),SimKartPin:getInt('dev-SimKartPin'),SimKartAPN:getText('dev-SimKartAPN'),SimKartAPNUsername:getText('dev-SimKartAPNUsername'),SimKartAPNSifresi:getText('dev-SimKartAPNSifresi'),NtpServer:getText('dev-NtpServer'),NtpServerPortu:getInt('dev-NtpServerPortu'),TimeZone:getInt('dev-TimeZone'),PeriyodikModemResetPeriyodu:getInt('dev-PeriyodikModemResetPeriyodu'),WebIlkVeriZamanAsimi:getInt('dev-WebIlkVeriZamanAsimi'),WebBostaKalmaZamanAsimi:getInt('dev-WebBostaKalmaZamanAsimi'),IEC104IlkVeriZamanAsimi:getInt('dev-IEC104IlkVeriZamanAsimi'),IEC104BostaKalmaZamanAsimi:getInt('dev-IEC104BostaKalmaZamanAsimi')}}
async function saveDevice(){if(!pageCache.device){toast('Read the current configuration first','err');return}if(!validatePage('device'))return;try{showLoad();const r=await api('/config/device',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(extractDevice())});hideLoad();if(r.success===false)throw new Error(r.error||'Save failed');clearDirty('device');toast('Saved successfully','ok')}catch(e){hideLoad();toast('Save error: '+e.message,'err')}}

// ---------------- NAVIGATION / RENDER ----------------
function renderPage(id,d){curId=id;const titles=Object.fromEntries(menuPages);$('title').textContent=titles[id]||id;document.querySelectorAll('.mi').forEach(e=>e.classList.toggle('a',e.dataset.id===id));let html='';if(id==='iec104')html=pageCache.iec104?renderIec104(pageCache.iec104):emptyCard('IEC104 Configuration','iec104');else if(id==='modbus')html=pageCache.modbus?renderModbus(pageCache.modbus):emptyCard('Modbus Configuration','modbus');else if(id==='rf')html=pageCache.rf?renderRf(pageCache.rf):emptyCard('RF Configuration','rf');else if(id==='rfmon')html=renderRfMon(pageCache.rfmon);else if(id==='board')html=pageCache.board?renderBoard(pageCache.board):renderBoard(null);else if(id==='iec-faults')html=renderFaults();else if(id==='syslogs')html=renderLogs();else if(id==='device')html=pageCache.device?renderDevice(pageCache.device):emptyCard('Device Management','device','Device information and configuration');else if(id==='terminal')html=renderTerminal();$('body').innerHTML=html;dirtyPages[id]=new Set();if(id==='terminal'){$('trmCmd')?.addEventListener('keydown',e=>{if(e.key==='Enter')trmSend()});$('trmCmd')?.focus()}if(id==='rf'&&pageCache.rf){selectRfTab(0);rfBindLive()}markOriginals($('body'));bindDirty(id,$('body'));updatePageState(id)}
function switchPageNow(id){curId=id;renderPage(id,pageCache[id])}
function switchPage(id){if(loading||id===curId)return;if(curId&&hasDirty(curId)){confirmAction('There are unsaved changes on this page. Leave and discard them?',()=>switchPageNow(id));return}switchPageNow(id)}
function buildMenu(){const m=$('menu');menuPages.forEach(p=>{const e=document.createElement('div');e.className='mi';e.dataset.id=p[0];e.textContent=p[1];e.onclick=()=>switchPage(p[0]);m.appendChild(e)})}
function selectRfTab(i){document.querySelectorAll('#body .tab').forEach((e,n)=>e.classList.toggle('active',n===i));for(let n=0;n<FEEDER_COUNT;n++)$('rf-pane-'+n)?.classList.toggle('active',n===i)}
function selectIecTab(i){document.querySelectorAll('#body .tab').forEach((e,n)=>e.classList.toggle('active',n===i));for(let n=0;n<FEEDER_COUNT;n++)$('iec-pane-'+n)?.classList.toggle('active',n===i)}
function selectModTab(i){document.querySelectorAll('#body .tab').forEach((e,n)=>e.classList.toggle('active',n===i));for(let n=0;n<FEEDER_COUNT;n++)$('mod-pane-'+n)?.classList.toggle('active',n===i)}
function selectFaultFeeder(i){faultFeeder=i;renderPage('iec-faults')}

// ---------------- MONITORING ----------------
async function readRfFeeder(i){if(loading)return;try{showLoad();const r=await api('/monitor/rf/'+i);hideLoad();if(r.success===false)throw new Error(r.error||'Failed');const d=r.data?.lines?.[0]||r.lines?.[0]||r.data||r;if(!pageCache.rfmon)pageCache.rfmon=[];pageCache.rfmon[i]=d;renderPage('rfmon');const card=$('rfmon-'+i);if(card){const body=card.querySelector('.card-body');body.innerHTML=buildRfMonitorTable(d)}toast('Feeder '+(i+1)+' read successfully','ok')}catch(e){hideLoad();toast('Read error: '+e.message,'err')}}
function buildRfMonitorTable(d){const fields=[['DEVICEID','Device ID',''],['CalismaModu','Working Mode',''],['HatFrekansi','Feeder Frequency','Hz'],['SistemSicakligi','System Temperature','°C'],['SistemDCGerilimi','System DC Voltage','V'],['5Vdc','5V DC','V'],['3V3dc','3.3V DC','V'],['ActirmaDCGerilimi','Trigger DC Voltage','V'],['FazAkimi','Phase Current','A'],['FazHataAkimi','Phase Fault Current','A'],['AktifArizaSayaci','Active Fault Counter',''],['GecmisAcmaSayisi','Previous Trip Count',''],['RSSI','RSSI','dBm'],['LQI','LQI','']];let h='<div class="table-wrap"><table class="phase-table"><thead><tr><th>Parameter</th><th>L1</th><th>L2</th><th>L3</th></tr></thead><tbody>';fields.forEach(f=>{const a=d[f[0]]||['-','-','-'];h+='<tr><td>'+f[1]+'</td><td>'+esc(fmt(a[0],f[2],f[0]==='5Vdc'||f[0]==='3V3dc'?2:f[0]==='FazAkimi'||f[0]==='FazHataAkimi'?1:undefined))+'</td><td>'+esc(fmt(a[1],f[2],f[0]==='5Vdc'||f[0]==='3V3dc'?2:f[0]==='FazAkimi'||f[0]==='FazHataAkimi'?1:undefined))+'</td><td>'+esc(fmt(a[2],f[2],f[0]==='5Vdc'||f[0]==='3V3dc'?2:f[0]==='FazAkimi'||f[0]==='FazHataAkimi'?1:undefined))+'</td></tr>'});return h+'</tbody></table></div>'}
async function readBoard(){await readPage('board')}

// ---------------- FAULTS / LOGS ----------------
async function loadFaults(){if(loading)return;try{showLoad();const r=await api('/faults?feeder='+faultFeeder);hideLoad();if(r.success===false)throw new Error(r.error||'Failed');rfFaultCache[faultFeeder]=r;renderPage('iec-faults');const total=(r.tc||[0,0,0]).reduce((a,b)=>a+b,0)+(r.pc||[0,0,0]).reduce((a,b)=>a+b,0);toast('Feeder '+(faultFeeder+1)+': '+total+' fault records loaded','ok')}catch(e){hideLoad();toast('Read error: '+e.message,'err')}}
async function loadSysLogs(){if(loading)return;try{showLoad();const r=await api('/syslogs?offset='+sysLogOffset+'&limit=30');hideLoad();if(r.success===false)throw new Error(r.error||'Failed');const logs=r.recs?r.recs.split('\n').filter(x=>x.trim()):[];sysLogOffset+=logs.length;const c=$('sysLogContent');if(c?.classList.contains('empty'))c.classList.remove('empty');if(c)c.innerHTML=(c.innerHTML==='Press Next Records to load logs.'?'':c.innerHTML)+logs.map(x=>'<div class="log">'+esc(x)+'</div>').join('');toast('Loaded '+logs.length+' system logs','ok');if(sysLogOffset>=r.t)sysLogOffset=0}catch(e){hideLoad();toast('Read error: '+e.message,'err')}}

// ---------------- ACTIONS / TERMINAL ----------------
function rebootDevice(){confirmAction('Are you sure you want to reboot the device?',async()=>{try{showLoad();const r=await api('/device/reboot',{method:'POST'});hideLoad();if(r.success===false)throw new Error(r.error||'Reboot failed');toast(r.message||'Reboot command accepted','ok')}catch(e){hideLoad();toast('Error: '+e.message,'err')}})}
const trmTs=()=>{const n=new Date(),p=(v,l=2)=>String(v).padStart(l,'0');return p(n.getHours())+':'+p(n.getMinutes())+':'+p(n.getSeconds())+'.'+p(n.getMilliseconds(),3)};
function trmAppend(text,cls){const out=$('trmOut');if(!out)return;const e=document.createElement('div');e.className='term-line '+cls;e.innerHTML='<span class="term-ts">'+trmTs()+'</span>';const t=document.createElement('span');t.textContent=(cls==='cmd'?'> ':'< ')+text;e.appendChild(t);out.appendChild(e);out.scrollTop=out.scrollHeight}
async function trmSend(){if(terminalBusy)return;const inp=$('trmCmd');if(!inp)return;const cmd=inp.value;if(!cmd)return;inp.value='';trmAppend(cmd,'cmd');terminalBusy=true;inp.disabled=true;try{const post=await api('/serial',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tx:cmd})});if(post.rx)trmAppend(post.rx,'res');else if(post.pending){const deadline=Date.now()+12000;while(Date.now()<deadline){await new Promise(r=>setTimeout(r,1000));const r=await api('/serial',{method:'GET'});if(r.rx){trmAppend(r.rx,'res');break}}}}catch(e){trmAppend('Error: '+e.message,'cmd')}terminalBusy=false;inp.disabled=false;inp.focus()}
function trmClr(){if($('trmOut'))$('trmOut').innerHTML=''}

// ---------------- INIT ----------------
document.addEventListener('click',resetSessionTimeout);document.addEventListener('change',e=>{const el=e.target;if(el&&el.tagName==='INPUT'&&el.type==='number'&&!el.disabled&&el.value!==''){const mn=el.min!==''?parseFloat(el.min):-Infinity,mx=el.max!==''?parseFloat(el.max):Infinity,v=parseFloat(el.value);if(Number.isFinite(v)){if(v<mn){el.value=mn;el.dispatchEvent(new Event('input',{bubbles:true}))}else if(v>mx){el.value=mx;el.dispatchEvent(new Event('input',{bubbles:true}))}}}});document.addEventListener('keypress',e=>{resetSessionTimeout();if(e.key==='Enter'&&$('loginModal').style.display==='flex')doLogin()});
function init(){const saved=sessionStorage.getItem('sessionToken');if(saved)s_sessionToken=saved;buildMenu();switchPage('iec104');$('initialLoading').remove();showLoginModal()}
init();

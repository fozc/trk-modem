name: Host tests

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: host-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Ceedling and integration tests (Linux 32-bit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Install test tools
        id: test_tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc-multilib python3-venv
          gem install ceedling --version 1.0.1 --no-document
          python3 -m venv "$RUNNER_TEMP/host-test-tools"
          "$RUNNER_TEMP/host-test-tools/bin/python" -m pip install gcovr
          "$RUNNER_TEMP/host-test-tools/bin/python" -m gcovr --version
          # All Ceedling and Make compiler/linker calls use this gcc wrapper.
          cat > "$RUNNER_TEMP/host-test-tools/bin/gcc" <<'SH'
          #!/usr/bin/env bash
          exec /usr/bin/gcc -m32 "$@"
          SH
          chmod +x "$RUNNER_TEMP/host-test-tools/bin/gcc"
          echo "$RUNNER_TEMP/host-test-tools/bin" >> "$GITHUB_PATH"

      - name: Verify 32-bit host ABI
        id: host_abi
        run: |
          cat > "$RUNNER_TEMP/host-abi.c" <<'C'
          #include <stdint.h>
          #include <stdatomic.h>
          _Static_assert(sizeof(void *) == 4U, "Require 32-bit pointers");
          _Static_assert(sizeof(long) == 4U, "Require 32-bit long");
          _Static_assert(sizeof(atomic_uint_fast32_t) == 4U,
                         "Require 32-bit atomic indices");
          int main(void)
          {
              return 0;
          }
          C
          gcc -std=c11 -Wall -Wextra -Werror "$RUNNER_TEMP/host-abi.c" -o "$RUNNER_TEMP/host-abi"
          readelf -h "$RUNNER_TEMP/host-abi"
          readelf -h "$RUNNER_TEMP/host-abi" | grep -q 'Class:.*ELF32'
          "$RUNNER_TEMP/host-abi"

      - name: Run all host tests
        run: |
          mkdir -p test/build/ci-logs
          ruby test/run_all.rb all 2>&1 | tee test/build/ci-logs/host-tests.log
          test -s test/build/ceedling/artifacts/test/junit_tests_report.xml

      # Coverage starts with clobber, which removes the normal test artifacts.
      - name: Preserve unit-test reports
        if: ${{ !cancelled() && hashFiles('test/build/ceedling/artifacts/test/*.xml') != '' }}
        run: |
          mkdir -p test/build/reports/test
          cp test/build/ceedling/artifacts/test/*.xml test/build/reports/test/

      - name: Generate unit-test coverage
        if: ${{ !cancelled() && steps.test_tools.outcome == 'success' && steps.host_abi.outcome == 'success' }}
        run: |
          mkdir -p test/build/ci-logs
          python -m gcovr --version
          ruby test/run_all.rb coverage 2>&1 | tee test/build/ci-logs/coverage.log
          test -s test/build/ceedling/artifacts/gcov/gcovr/GcovCoverageCobertura.xml
          test -s test/build/ceedling/artifacts/gcov/gcovr/GcovCoverageResults.html

      - name: Upload test reports
        if: ${{ !cancelled() && hashFiles('test/build/ci-logs/*.log') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: host-test-reports
          if-no-files-found: error
          path: |
            test/build/reports/test/*.xml
            test/build/ceedling/artifacts/gcov/**
            test/build/ci-logs/*.log
